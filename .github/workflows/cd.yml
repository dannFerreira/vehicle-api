name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application
        run: bash mvnw package -DskipTests

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ~/vehicle-api/target"

      - name: Copy deployment files
        run: |
          scp target/*.jar \
              Dockerfile \
              docker-compose.yml \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/vehicle-api/

          scp target/*.jar \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/vehicle-api/target/

      - name: Deploy
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/vehicle-api
            docker compose up -d --build
            docker compose ps
          EOF