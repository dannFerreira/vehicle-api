services:
  postgres:
    image: postgres:16
    container_name: vehicle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vehicle_db
      POSTGRES_USER: vehicle
      POSTGRES_PASSWORD: vehicle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: